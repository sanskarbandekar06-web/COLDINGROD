<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<main class="w-full max-w-[440px]">
<!-- Brand / Header -->
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-xs">Coldingrod</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create your account</p>
</div>
<!-- Registration Card (Bento Style) -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm p-md md:p-lg relative overflow-hidden">
<!-- Glassmorphism subtle accent -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<form action="#" class="flex flex-col gap-sm relative z-10" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant select-none" data-icon="person">person</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/50 pl-10 pr-sm py-2.5 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Work Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant select-none" data-icon="mail">mail</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/50 pl-10 pr-sm py-2.5 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant select-none" data-icon="lock">lock</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/50 pl-10 pr-10 py-2.5 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" tabindex="-1" type="button">
<span class="material-symbols-outlined select-none" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Password Strength Indicator (Simulated) -->
<div class="flex gap-xs mt-1">
<div class="h-1 flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-error transition-all duration-300"></div>
</div>
<div class="h-1 flex-1 bg-surface-variant rounded-full overflow-hidden">
<!-- empty -->
</div>
<div class="h-1 flex-1 bg-surface-variant rounded-full overflow-hidden">
<!-- empty -->
</div>
</div>
<span class="font-label-md text-label-md text-outline text-right">Weak</span>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant select-none" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/50 pl-10 pr-sm py-2.5 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="mt-md flex flex-col gap-sm">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md rounded-lg py-2.5 hover:bg-on-background transition-colors flex items-center justify-center gap-2" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                        Already have an account? <a class="text-secondary hover:underline font-medium" href="#">Sign in</a>
</p>
</div>
</form>
</div>
<!-- Footer / Legal -->
<div class="mt-lg text-center font-label-md text-label-md text-outline">
<p>By creating an account, you agree to our</p>
<p><a class="hover:text-secondary transition-colors underline decoration-outline-variant underline-offset-2" href="#">Terms of Service</a> and <a class="hover:text-secondary transition-colors underline decoration-outline-variant underline-offset-2" href="#">Privacy Policy</a>.</p>
</div>
</main>
