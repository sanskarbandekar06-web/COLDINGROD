<!DOCTYPE html>

<html class="h-full" lang="en"><head>

                      "background": "#f8f9ff",

                      "surface-container-low": "#eff4ff",
                      "primary-fixed-dim": "#bec6e0",

              },
              "borderRadius": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .bento-shadow {
            box-shadow: 0 4px 24px -4px rgba(11, 28, 48, 0.05);
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #645efb;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #645efb;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e2e8f0;
            transition: all 0.3s;
        }
        .toggle-label {
            background-color: #cbd5e1;
            border-radius: 9999px;
            transition: all 0.3s;
        }
      </style>
</head>
<body class="bg-background text-on-background h-full font-body-md antialiased flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Linear/Transactional Page - Navigation Suppressed -->
<main class="w-full max-w-[640px] mx-auto">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-primary tracking-tight">Coldingrod</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Step 2 of 3: Personalize your workspace</p>
</div>
<!-- Bento Container -->
<div class="bg-surface-container-lowest rounded-xl bento-shadow p-md md:p-xl border border-outline-variant/30 flex flex-col gap-xl">
<!-- Section 1: Profile Upload -->
<section class="flex flex-col items-center gap-md">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center transition-all group-hover:border-secondary group-hover:bg-surface-variant overflow-hidden">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-secondary transition-colors" data-icon="add_photo_alternate">
                            add_photo_alternate
                        </span>
<!-- Hidden File Input -->
<input aria-label="Upload profile picture" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
<!-- Overlay for hover state -->
<div class="absolute inset-0 rounded-full bg-secondary/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="upload">upload</span>
</div>
</div>
<div class="text-center">
<h2 class="font-title-md text-title-md text-on-surface">Profile Picture</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Upload a professional headshot</p>
</div>
</section>
<!-- Section 2: Personal Details (Pre-filled) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="first-name">First Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-colors" id="first-name" readonly="" type="text" value="Jane"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="last-name">Last Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-colors" id="last-name" readonly="" type="text" value="Doe"/>
</div>
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="role">Primary Role</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-colors" id="role" readonly="" type="text" value="VP of Operations"/>
</div>
</section>
<hr class="border-outline-variant/30 w-full"/>
<!-- Section 3: Preferences -->
<section class="flex flex-col gap-lg">
<h3 class="font-title-lg text-title-lg text-on-surface">Preferences</h3>
<div class="flex flex-col gap-md">
<!-- AI Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container rounded-lg border border-outline-variant/30 hover:border-secondary/30 transition-colors">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">AI Assistance Level</p>
<p class="font-body-md text-body-md text-on-surface-variant">Enable pro-active suggestions and automation.</p>
</div>
</div>
<!-- Toggle Switch -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" id="toggle-ai" name="toggle-ai" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="toggle-ai"></label>
</div>
</div>
<!-- Theme Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container rounded-lg border border-outline-variant/30 hover:border-secondary/30 transition-colors">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Interface Theme</p>
<p class="font-body-md text-body-md text-on-surface-variant">Currently set to Light mode.</p>
</div>
</div>
<!-- Segmented Control for Theme -->
<div class="flex bg-surface-container-high rounded-lg p-xs border border-outline-variant/30">
<button class="px-sm py-xs rounded-md bg-surface-container-lowest text-primary shadow-sm font-label-md text-label-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="light_mode">light_mode</span>
                                Light
                            </button>
<button class="px-sm py-xs rounded-md text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center gap-xs transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="dark_mode">dark_mode</span>
                                Dark
                            </button>
</div>
</div>
</div>
</section>
<!-- Actions -->
<div class="pt-sm mt-auto flex justify-end">
<button class="bg-primary hover:bg-on-background text-on-primary font-title-md text-title-md px-lg py-sm rounded-lg shadow-sm transition-all flex items-center gap-sm">
                    Next Step
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
