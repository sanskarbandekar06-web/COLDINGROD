<style>
        /* Ambient Background Animation */
        @keyframes subtle-drift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-ambient {
            background: linear-gradient(-45deg, #f8f9ff, #eff4ff, #dce9ff, #f8f9ff);
            background-size: 400% 400%;
            animation: subtle-drift 15s ease infinite;
        }

        /* Toast Animation */
        @keyframes slide-in-top {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .toast-animate {
            animation: slide-in-top 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Celebration Confetti Effect */
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #645efb;
            animation: float-up 2s ease-in-out infinite;

<!-- Subtle Background Shader (Layer 0 Canvas enhancement) -->

<script>
        // Simple particle effect for celebration
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles');
            const colors = ['#645efb', '#4b41e1', '#d3e4fe', '#000000'];
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Randomize position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${50 + Math.random() * 50}%`; // Start lower half
                
                // Randomize appearance
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = `${Math.random() * 2}s`;
                particle.style.animationDuration = `${1.5 + Math.random()}s`;
                
                container.appendChild(particle);
            }
        });
    </script>
